name: Build Android APK

on:
  push:
    branches: [ "main", "master", "dhiman123456a-code" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix Kotlin Conflict in Gradle
        run: |
          echo "" >> android/app/build.gradle
          echo "configurations.all (" >> android/app/build.gradle
          echo "    resolutionStrategy.eachDependency ( DependencyResolveDetails details ->" >> android/app/build.gradle
          echo "        if (details.requested.group == 'org.jetbrains.kotlin') {" >> android/app/build.gradle
          echo "            details.useVersion '1.8.22'" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    })" >> android/app/build.gradle
          echo ")" >> android/app/build.gradle

      - name: Build Android APK via Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaffManagement-App
          path: app/build/outputs/apk/debug/app-debug.apk
